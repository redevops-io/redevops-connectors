[project]
name = "redevops-connectors"
version = "0.1.0"
description = "ReDevOps Integration Plane — the IntegrationAdapter connector SDK: one contract, many governed provider adapters (OAuth/credentials via SecretRef), fixtures + conformance."
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
dependencies = []  # the SDK core is stdlib-only; providers pull their own deps as extras

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redevops_connectors"]
