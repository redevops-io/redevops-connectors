name: secret-scan
# Detects committed secrets with the gitleaks BINARY (free; no org license needed — the gitleaks Action
# requires a paid license for organizations, the binary does not). --redact guarantees no secret VALUE is ever
# printed in logs. The plan-independent substitute for GitHub's native secret scanning (a paid add-on on private
# repos). A failing run means a real secret is committed: rotate it and purge it from history.
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (redacted)
        run: |
          set -euo pipefail
          # Pinned version — avoids the unauthenticated GitHub API 'releases/latest' call, which
          # rate-limits (403) on shared Actions IPs and, under 'set -e', would leave an empty version and a
          # broken download URL that fails CI transiently. Bump deliberately.
          ver="8.30.1"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz" \
                 | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
